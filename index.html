    <script>
        // JavaScript Recipe Parser Class
        class RecipeParser {
            constructor() {
            }

            async fetchPage(url) {
                try {
                    // Since we can't directly fetch due to CORS, we'll use a proxy service
                    const proxyUrl = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`;
                    const response = await fetch(proxyUrl);

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const html = await response.text();
                    const parser = new DOMParser();
                    return parser.parseFromString(html, 'text/html');
                } catch (error) {
                    console.error('Error fetching page:', error);
                    throw new Error('Unable to fetch recipe page. This might be due to CORS restrictions.');
                }
            }

            extractJsonLd(doc) {
                const scripts = doc.querySelectorAll('script[type="application/ld+json"]');

                for (let script of scripts) {
                    try {
                        const data = JSON.parse(script.textContent);
                        const recipeData = this.findRecipeInData(data);
                        if (recipeData) {
                            return recipeData;
                        }
                    } catch (e) {
                        continue;
                    }
                }
                return null;
            }

            findRecipeInData(data) {
                if (Array.isArray(data)) {
                    for (let item of data) {
                        const result = this.findRecipeInData(item);
                        if (result) return result;
                    }
                } else if (typeof data === 'object' && data !== null) {
                    if (data['@type'] === 'Recipe') {
                        return data;
                    }
                    for (let value of Object.values(data)) {
                        const result = this.findRecipeInData(value);
                        if (result) return result;
                    }
                }
                return null;
            }

            extractMicrodata(doc) {
                const recipeData = {};
                const recipeElem = doc.querySelector('[itemtype*="schema.org/Recipe"]');

                if (!recipeElem) return recipeData;

                const name = recipeElem.querySelector('[itemprop="name"]');
                if (name) recipeData.name = name.textContent.trim();

                const description = recipeElem.querySelector('[itemprop="description"]');
                if (description) recipeData.description = description.textContent.trim();

                const ingredients = recipeElem.querySelectorAll('[itemprop="recipeIngredient"]');
                if (ingredients.length) {
                    recipeData.recipeIngredient = Array.from(ingredients).map(ing => ing.textContent.trim());
                }

                const instructions = recipeElem.querySelectorAll('[itemprop="recipeInstructions"]');
                if (instructions.length) {
                    recipeData.recipeInstructions = Array.from(instructions).map(inst => ({
                        text: inst.textContent.trim()
                    }));
                }

                return recipeData;
            }

            extractFallback(doc) {
                const recipeData = {};

                // Try to find title
                const titleSelectors = [
                    'h1.recipe-title', 'h1.entry-title', '.recipe-header h1',
                    'h1', '.recipe-title', '[class*="recipe"] h1'
                ];

                for (let selector of titleSelectors) {
                    const title = doc.querySelector(selector);
                    if (title) {
                        recipeData.name = title.textContent.trim();
                        break;
                    }
                }

                // Try to find ingredients
                const ingredientSelectors = [
                    '.recipe-ingredients li', '.ingredients li', '[class*="ingredient"] li',
                    '.recipe-ingredients p', '.ingredients p', '[class*="ingredient"] p'
                ];

                for (let selector of ingredientSelectors) {
                    const ingredients = doc.querySelectorAll(selector);
                    if (ingredients.length) {
                        recipeData.recipeIngredient = Array.from(ingredients).map(ing => ing.textContent.trim());
                        break;
                    }
                }

                // Try to find instructions
                const instructionSelectors = [
                    '.recipe-instructions li', '.instructions li', '[class*="instruction"] li',
                    '.recipe-instructions p', '.instructions p', '[class*="instruction"] p',
                    '.recipe-directions li', '.directions li', '[class*="direction"] li'
                ];

                for (let selector of instructionSelectors) {
                    const instructions = doc.querySelectorAll(selector);
                    if (instructions.length) {
                        recipeData.recipeInstructions = Array.from(instructions)
                            .map(inst => ({ text: inst.textContent.trim() }))
                            .filter(inst => inst.text.length > 10);
                        break;
                    }
                }

                return recipeData;
            }

            scaleRecipe(recipeData, scaleFactor) {
                const scaled = { ...recipeData };

                if (scaled.ingredients) {
                    scaled.ingredients = scaled.ingredients.map(ingredientText => {
                        const parsed = ingredientParser.parseIngredient(ingredientText);

                        if (parsed.parsed && parsed.quantity != null) {
                            return ingredientParser.scaleIngredient(parsed, scaleFactor);
                        }

                        return ingredientText;
                    });
                }

                if (scaled.servings) {
                    const servingsNum = parseInt(scaled.servings);
                    if (!isNaN(servingsNum)) {
                        scaled.servings = Math.round(servingsNum * scaleFactor).toString();
                    }
                }

                return scaled;
            }

            cleanRecipeData(data) {
                const cleaned = {};

                if (data.name) cleaned.name = data.name.trim();
                if (data.description) cleaned.description = data.description.trim();

                if (data.recipeIngredient) {
                    cleaned.ingredients = Array.isArray(data.recipeIngredient)
                        ? data.recipeIngredient.map(ing => ing.trim()).filter(ing => ing)
                        : [data.recipeIngredient.trim()];
                }

                if (data.recipeInstructions) {
                    cleaned.instructions = [];
                    const instructions = Array.isArray(data.recipeInstructions) ? data.recipeInstructions : [data.recipeInstructions];

                    for (let inst of instructions) {
                        let text = typeof inst === 'object' ? inst.text : inst;
                        if (text && text.trim()) {
                            cleaned.instructions.push(text.trim());
                        }
                    }
                }

                // Additional metadata
                if (data.prepTime) cleaned.prepTime = data.prepTime;
                if (data.cookTime) cleaned.cookTime = data.cookTime;
                if (data.totalTime) cleaned.totalTime = data.totalTime;
                if (data.recipeYield) cleaned.servings = data.recipeYield.toString();

                return cleaned;
            }

            async parseRecipeFromUrl(url) {
                try {
                    const doc = await this.fetchPage(url);

                    // Try JSON-LD first
                    let recipeData = this.extractJsonLd(doc);
                    if (recipeData && recipeData.name) {
                        console.log('Extracted recipe using JSON-LD');
                        return this.cleanRecipeData(recipeData);
                    }

                    // Try microdata
                    recipeData = this.extractMicrodata(doc);
                    if (recipeData && recipeData.name) {
                        console.log('Extracted recipe using microdata');
                        return this.cleanRecipeData(recipeData);
                    }

                    // Fallback method
                    recipeData = this.extractFallback(doc);
                    if (recipeData && recipeData.name) {
                        console.log('Extracted recipe using fallback method');
                        return this.cleanRecipeData(recipeData);
                    }

                    throw new Error('Could not extract recipe data from this URL');
                } catch (error) {
                    console.error('Error parsing recipe:', error);
                    throw error;
                }
            }
        }

        // Global variables
        let cookbooks = {
            "All Recipes": []
        };
        let currentRecipe = null;
        let originalRecipe = null;
        let currentFolder = "All Recipes";

        // Parser
        const parser = new RecipeParser();
        const ingredientParser = new IngredientParser();

        // Editing recipes
        let isEditing = false;
        let editingSavedIndex = null;

        // Editing cookbooks
        let isEditingCookbooks = false;

        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar();
            showSavedRecipes();
        });

        // Load saved recipes on startup
        loadCookbooks();

        function createFolder() {
            const name = prompt("Enter cookbook name:");
            if (!name) return;

            if (cookbooks[name]) {
                showStatus("Cookbook already exists!", "error");
                return;
            }

            cookbooks[name] = [];
            localStorage.setItem("cookbooks", JSON.stringify(cookbooks));

            showStatus("Cookbook created!", "success");
        }

        function loadSavedRecipe(index) {
            const recipe = cookbooks["All Recipes"][index];
            if (recipe) {
                currentRecipe = { ...recipe };
                originalRecipe = { ...recipe };
                editingSavedIndex = index;
                displayRecipe(recipe);
            }
        }

        function loadCookbooks() {
            const stored = localStorage.getItem("cookbooks");

            if (stored) {
                try {
                    cookbooks = JSON.parse(stored);
                } catch (e) {
                    cookbooks = { "All Recipes": [] };
                }
            }

            updateRecipeCount();
        }

        function updateRecipeCount() {
            const count = cookbooks["All Recipes"].length;
            const counter = document.getElementById("recipeCount");
            if (counter) {
                counter.textContent = count;
            }
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';

            if (type === 'loading') {
                status.innerHTML = `<span class="loading-spinner"></span> ${message}`;
            }

            if (type !== 'loading') {
                setTimeout(() => {
                    status.style.display = 'none';
                }, 3000);
            }
        }

        async function parseRecipe() {
            const url = document.getElementById('urlInput').value.trim();

            if (!url) {
                showStatus('Please enter a valid URL', 'error');
                return;
            }

            const alreadySaved = cookbooks["All Recipes"].find(r => r.url === url);
            if (alreadySaved) {
                showStatus("Recipe already saved. Loading saved version instead.", "error");
                const index = cookbooks["All Recipes"].indexOf(alreadySaved);
                loadSavedRecipe(index);
                return;
            }

            // Show loading state
            showStatus('Parsing recipe from website...', 'loading');
            document.getElementById('parseBtn').innerHTML = '<span class="loading-spinner"></span> Parsing...';
            document.getElementById('recipeDisplay').style.display = 'none';

            try {
                const recipe = await parser.parseRecipeFromUrl(url);

                // Add metadata
                recipe.url = url;
                recipe.dateAdded = new Date().toISOString();

                // Set default values if missing
                if (!recipe.prepTime) recipe.prepTime = 'Not specified';
                if (!recipe.cookTime) recipe.cookTime = 'Not specified';
                if (!recipe.servings) recipe.servings = 'Not specified';

                currentRecipe = recipe;
                editingSavedIndex = null;
                originalRecipe = { ...recipe }; // Store original for scaling
                displayRecipe(recipe);
                showStatus('Recipe parsed successfully!', 'success');
            } catch (error) {
                showStatus(error.message || 'Failed to parse recipe. Please try another URL.', 'error');
            } finally {
                document.getElementById('parseBtn').textContent = 'Parse Recipe';
            }
        }

        async function saveRecipeToFirebase(currentRecipe) {
            try {
                const docId = encodeURIComponent(currentRecipe.url);

                const docRef = doc(db, "Recipes", docId);

                await setDoc(docRef, {
                    title: currentRecipe.name, // ✅ FIXED
                    ingredients: currentRecipe.ingredients,
                    instructions: currentRecipe.instructions,
                    url: currentRecipe.url,
                    dateAdded: currentRecipe.dateAdded || new Date().toISOString()
                });

                console.log("Recipe saved to Firebase!");
            } catch (error) {
                console.error("Error saving recipe:", error);
            }
        }

        function generateRandomRecipes() {
            const count = document.getElementById('randomRecipeCount').value;
            
            // Gather all checked requirements
            const checkedBoxes = document.querySelectorAll('.req-checkbox:checked');
            const requirements = Array.from(checkedBoxes).map(cb => cb.value);
            
            fetch('http://localhost:3000/api/generate-random', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ count: parseInt(count), requirements: requirements })
            })
            .then(response => response.json())
            .then(data => {
                showStatus("Request sent to backend!", "success");
            })
            .catch(error => {
                console.error('Error:', error);
                showStatus("Failed to contact backend", "error");
            });
        }

            document.getElementById('recipeTitle').innerHTML =

            // Make servings editable

                ).join('') +
                `<button class="btn btn-secondary add-btn" onclick="addIngredient()">+ Add Ingredient</button>`;

            // Instructions editable
            const instructionList = document.getElementById('instructionList');
            instructionList.innerHTML = currentRecipe.instructions
                .map((step, i) =>
                    `<li class="editable-item">
            <span class="drag-handle">☰</span>
            <textarea class="edit-instruction" style="flex:1;">${step}</textarea>
            <button class="delete-row-btn" onclick="removeInstruction(this)">✖</button>
        </li>`
                ).join('') +
                `<button class="btn btn-secondary add-btn" onclick="addInstruction()">+ Add Step</button>`;

            // 🔥 BUTTON CONTROL (no layout shift)

            document.getElementById('saveBtn').style.display = 'none';
            document.getElementById('editBtn').style.display = 'none';
            document.getElementById('deleteBtn').style.display = 'none';

            const actions = document.getElementById('recipeActions');

            // Add Save Changes & Cancel inside the same button row
            actions.insertAdjacentHTML('beforeend', `
        <button class="btn btn-primary" 
                id="saveChangesBtn" 
                onclick="saveEdits()">
            Save Changes
        </button>

                onclick="cancelEdit()">

        </button>
    `);

            enableDragAndDrop('ingredientList');
            enableDragAndDrop('instructionList');
        }

        function addIngredient() {
            const list = document.getElementById('ingredientList');
            const li = document.createElement('li');
            li.className = "editable-item";
            li.innerHTML = `
        <span class="drag-handle">☰</span>
        <input type="text" class="edit-ingredient" style="flex:1;">
        <button class="delete-row-btn" onclick="removeIngredient(this)">✖</button>
    `;
            list.insertBefore(li, list.lastElementChild);
        }

        function removeIngredient(button) {
            button.parentElement.remove();
        }

        function addInstruction() {
            const list = document.getElementById('instructionList');
            const li = document.createElement('li');
            li.className = "editable-item";
            li.innerHTML = `
        <span class="drag-handle">☰</span>
        <textarea class="edit-instruction" style="flex:1;"></textarea>
        <button class="delete-row-btn" onclick="removeInstruction(this)">✖</button>
    `;
            list.insertBefore(li, list.lastElementChild);
        }

        function removeInstruction(button) {
            button.parentElement.remove();
        }

        function enableDragAndDrop(containerId) {
            const container = document.getElementById(containerId);

            // Only editable-items are draggable
            container.querySelectorAll('.editable-item').forEach(item => {
                item.draggable = true;

                item.addEventListener('dragstart', () => {
                    item.classList.add('dragging');
                });

                item.addEventListener('dragend', () => {
                    item.classList.remove('dragging');
                });
            });

            container.addEventListener('dragover', e => {
                e.preventDefault();
                const dragging = container.querySelector('.dragging');

                // Never allow dropping after the add button
                const afterElement = getDragAfterElement(container, e.clientY);

                if (!afterElement) {
                    // Insert before the last editable item (so add button stays last)
                    const editableItems = container.querySelectorAll('.editable-item');
                    container.insertBefore(dragging, editableItems[editableItems.length - 1].nextSibling);
                } else {
                    container.insertBefore(dragging, afterElement);
                }
            });
        }

        function getDragAfterElement(container, y) {
            // Only consider editable-items, exclude add buttons
            const draggableElements = [...container.querySelectorAll('.editable-item:not(.dragging)')];

            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;

                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function saveEdits() {
            if (!currentRecipe) return;

            // 🔹 Collect values IN THE ORDER THEY APPEAR IN THE DOM
            const updatedIngredients = Array.from(
                document.querySelectorAll('#ingredientList .edit-ingredient')
            )
                .map(input => input.value.trim())
                .filter(value => value !== "");

            const updatedInstructions = Array.from(
                document.querySelectorAll('#instructionList .edit-instruction')
            )
                .map(textarea => textarea.value.trim())
                .filter(value => value !== "");

            const updatedRecipe = {
                ...currentRecipe,
                name: document.getElementById('editTitle').value.trim(),
                servings: document.getElementById('editServings').value.trim(),
                ingredients: updatedIngredients,
                instructions: updatedInstructions
            };

            isEditing = false;

            // 🔹 If editing a saved recipe → ask whether to overwrite or copy
            if (editingSavedIndex !== null) {
                showSaveChoicePopup(updatedRecipe);
                return;
            }

            // 🔹 If editing an unsaved recipe
            currentRecipe = updatedRecipe;
            originalRecipe = { ...updatedRecipe };

            cleanupEditUI();
            displayRecipe(updatedRecipe);
            showStatus("Recipe updated successfully!", "success");
        }
        function showSaveChoicePopup(updatedRecipe) {

            const popup = document.createElement("div");
            popup.id = "saveChoicePopup";
            popup.style.position = "fixed";
            popup.style.top = "0";
            popup.style.left = "0";
            popup.style.width = "100%";
            popup.style.height = "100%";
            popup.style.background = "rgba(0,0,0,0.5)";
            popup.style.display = "flex";
            popup.style.justifyContent = "center";
            popup.style.alignItems = "center";
            popup.style.zIndex = "9999";

            popup.innerHTML = `
        <div style="background:white; padding:25px; border-radius:10px; text-align:center; width:300px;">
            <h3>Save Recipe As...</h3>
            <button class="btn btn-primary" style="margin:10px;" id="saveOriginalBtn">
                Original
            </button>
            <button class="btn btn-secondary" style="margin:10px;" id="saveCopyBtn">
                Copy
            </button>
        </div>
    `;

            document.body.appendChild(popup);

            document.getElementById("saveOriginalBtn").onclick = function () {

                updatedRecipe.dateAdded = cookbooks["All Recipes"][editingSavedIndex].dateAdded;
                cookbooks["All Recipes"][editingSavedIndex] = updatedRecipe;

                finishSave(updatedRecipe, editingSavedIndex);
            };

            document.getElementById("saveCopyBtn").onclick = function () {

                updatedRecipe.dateAdded = new Date().toISOString();
                cookbooks["All Recipes"].push(updatedRecipe);

                const newIndex = cookbooks["All Recipes"].length - 1;

                finishSave(updatedRecipe, newIndex);
            };
        }

        function finishSave(recipe, index) {

            localStorage.setItem('cookbooks', JSON.stringify(cookbooks));

            // Update counter immediately
            document.getElementById('recipeCount').textContent = cookbooks["All Recipes"].length;

            editingSavedIndex = index;
            currentRecipe = { ...recipe };
            originalRecipe = { ...recipe };

            cleanupEditUI();
            displayRecipe(recipe);

            // Remove popup
            const popup = document.getElementById("saveChoicePopup");
            if (popup) popup.remove();

            showStatus("Recipe saved successfully!", "success");
        }

            isEditing = false;

        }

        function cleanupEditUI() {

            const saveChangesBtn = document.getElementById("saveChangesBtn");
            const cancelEditBtn = document.getElementById("cancelEditBtn");

            if (saveChangesBtn) saveChangesBtn.remove();
            if (cancelEditBtn) cancelEditBtn.remove();

            document.getElementById('saveBtn').style.display = 'inline-block';
            document.getElementById('editBtn').style.display = 'inline-block';

            if (editingSavedIndex !== null) {
                document.getElementById('deleteBtn').style.display = 'inline-block';
            } else {
                document.getElementById('deleteBtn').style.display = 'none';
            }
        }

            const name = prompt("Enter cookbook name:");
            if (!name || cookbooks[name]) return;

            cookbooks[name] = [];

            localStorage.setItem("cookbooks", JSON.stringify(cookbooks));
            renderSidebar();
        }

        function enterCookbookEditMode() {
            isEditingCookbooks = true;
            renderSidebar();
        }

        function enableCookbookDrag() {

            const container = document.getElementById("cookbookEditList");

            const items = container.querySelectorAll(".cookbook-item");

            items.forEach(item => {

                item.addEventListener("dragstart", () => {
                    item.classList.add("dragging");
                });

                item.addEventListener("dragend", () => {
                    item.classList.remove("dragging");
                });
            });

            container.addEventListener("dragover", e => {
                e.preventDefault();

                const dragging = container.querySelector(".dragging");
                const afterElement = getCookbookDragAfter(container, e.clientY);

                if (!afterElement) {
                    container.appendChild(dragging);
                } else {
                    container.insertBefore(dragging, afterElement);
                }
            });
        }

        function getCookbookDragAfter(container, y) {

            const elements = [...container.querySelectorAll(".cookbook-item:not(.dragging)")];

            return elements.reduce((closest, child) => {

                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;

                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }

            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function saveCookbookOrder() {

            const items = document.querySelectorAll("#cookbookEditList .cookbook-item");

            const newCookbooks = {};

            items.forEach(item => {

                const name = item.querySelector("span:nth-child(2)").textContent;

                newCookbooks[name] = cookbooks[name];
            });

            cookbooks = newCookbooks;

            localStorage.setItem("cookbooks", JSON.stringify(cookbooks));

            isEditingCookbooks = false;
            renderSidebar();
        }

        function cancelCookbookEdit() {
            isEditingCookbooks = false;
            renderSidebar();
        }

        function deleteCookbook(name) {

            if (name === "All Recipes") {
                showStatus("Cannot delete All Recipes", "error");
                return;
            }

            const confirmDelete = confirm(`Delete cookbook "${name}"?`);
            if (!confirmDelete) return;

            delete cookbooks[name];

            localStorage.setItem("cookbooks", JSON.stringify(cookbooks));
            renderSidebar();
        }

        function displayRecipe(recipe) {



            document.getElementById('recipeTitle').textContent =
                recipe.name || 'Untitled Recipe';

            // Meta information
            const meta = document.getElementById('recipeMeta');
            meta.innerHTML = `
        <div class="meta-item">⏱️ Prep: ${recipe.prepTime || 'Not specified'}</div>
        <div class="meta-item">🍳 Cook: ${recipe.cookTime || 'Not specified'}</div>
        <div class="meta-item">🍽️ Serves: ${recipe.servings || 'Not specified'}</div>
    `;

            // Ingredients
            const ingredientList = document.getElementById('ingredientList');
            if (recipe.ingredients && recipe.ingredients.length) {
                ingredientList.innerHTML = recipe.ingredients
                    .map(ingredient => `<li>${ingredient}</li>`)
                    .join('');
            } else {
                ingredientList.innerHTML = '<li>No ingredients found</li>';
            }

            // Instructions
            const instructionList = document.getElementById('instructionList');
            if (recipe.instructions && recipe.instructions.length) {
                instructionList.innerHTML = recipe.instructions
                    .map(instruction => `<li>${instruction}</li>`)
                    .join('');
            } else {
                instructionList.innerHTML = '<li>No instructions found</li>';
            }

            document.getElementById('recipeDisplay').style.display = 'block';
            document.getElementById('savedRecipesList').style.display = 'none';
            document.getElementById('scaleInput').value = 1;

            // Show delete button only for saved recipes
            const deleteBtn = document.getElementById("deleteBtn");

            if (editingSavedIndex !== null) {
                deleteBtn.style.display = "inline-block";
            } else {
                deleteBtn.style.display = "none";
            }
        }

        function deleteCurrentRecipe() {

            if (editingSavedIndex === null) return;

            const confirmDelete = confirm("Are you sure you want to delete this recipe?");
            if (!confirmDelete) return;

            cookbooks["All Recipes"].splice(editingSavedIndex, 1);

            localStorage.setItem('cookbooks', JSON.stringify(cookbooks));

            updateRecipeCount();

            currentRecipe = null;
            originalRecipe = null;
            editingSavedIndex = null;

            document.getElementById('recipeDisplay').style.display = 'none';

            showSavedRecipes();

            showStatus("Recipe deleted successfully!", "success");
        }

        function deleteRecipeFromList(index) {

            const confirmDelete = confirm("Delete this recipe?");
            if (!confirmDelete) return;

            cookbooks["All Recipes"].splice(index, 1);

            localStorage.setItem('cookbooks', JSON.stringify(cookbooks));

            updateRecipeCount();

            showSavedRecipes();

            showStatus("Recipe deleted successfully!", "success");
        }

        function scaleCurrentRecipe() {
            if (!originalRecipe) return;

            const scaleFactor = parseFloat(document.getElementById('scaleInput').value);
            if (isNaN(scaleFactor) || scaleFactor <= 0) {
                showStatus('Please enter a valid scale factor', 'error');
                return;
            }

            currentRecipe = parser.scaleRecipe(originalRecipe, scaleFactor);
            displayRecipe(currentRecipe);

            if (scaleFactor !== 1) {
                showStatus(`Recipe scaled by ${scaleFactor}x`, 'success');
            }
        }

        async function saveRecipe() {
            if (!currentRecipe) return;

            const exists = cookbooks["All Recipes"]
                .some(recipe => recipe.url === currentRecipe.url);

            if (exists) {
                showStatus("Recipe already saved!", "error");
                return;
            }

            cookbooks["All Recipes"].push({ ...currentRecipe });

            saveRecipeToFirebase(currentRecipe);

            // localStorage.setItem("cookbooks", JSON.stringify(cookbooks));
            updateRecipeCount();

            showStatus("Recipe saved to All Recipes!", "success");
        }

</h3>

                <button class="btn btn-secondary"

                    Cancel
                </button>
            </div>
        `;

                enableCookbookDrag();
            }
        }
        // Also update showSavedRecipes to remove the "tabs" from the center
        function showSavedRecipes() {
            const container = document.getElementById('savedRecipesContent');
            const listDiv = document.getElementById('savedRecipesList');
            const recipes = cookbooks[currentFolder] || [];

            if (recipes.length === 0) {
                container.innerHTML = `

                </div>
                <div style="display:flex; gap:8px;">
                    ${currentFolder === "All Recipes" ? `
                        <button class="btn-small" onclick="addToCookbook(${index}); event.stopPropagation();">Add</button>
                        <button class="btn-small" onclick="deleteRecipeFromList(${index}); event.stopPropagation();">Delete</button>
                    ` : `
                        <button class="btn-small" onclick="removeFromFolder(${index}); event.stopPropagation();">Remove</button>
                    `}
                </div>
            </div>
        `).join("");
            }

            document.getElementById('recipeDisplay').style.display = 'none';
            listDiv.style.display = 'block';
        }

            const name = prompt("Enter cookbook name:");
            if (!name || cookbooks[name]) return;

            localStorage.setItem("cookbooks", JSON.stringify(cookbooks));
            renderSidebar();
        }

        function switchFolder(name) {
            currentFolder = name;
            showSavedRecipes();
            renderSidebar();
        }

        function addToCookbook(index) {

            const recipe = cookbooks["All Recipes"][index];

            const folderName = prompt("Add to which cookbook?");

            if (!folderName || !cookbooks[folderName]) {
                showStatus("Cookbook not found!", "error");
                return;
            }

            const exists = cookbooks[folderName]
                .some(r => r.url === recipe.url);

            if (exists) {
                showStatus("Recipe already in that cookbook!", "error");
                return;
            }

            cookbooks[folderName].push(recipe);

            localStorage.setItem("cookbooks", JSON.stringify(cookbooks));

            showStatus("Recipe added to cookbook!", "success");
        }

        function removeFromFolder(index) {

            const confirmRemove = confirm("Remove from this cookbook?");
            if (!confirmRemove) return;

            cookbooks[currentFolder].splice(index, 1);

            localStorage.setItem("cookbooks", JSON.stringify(cookbooks));

            showSavedRecipes();
            showStatus("Removed from cookbook!", "success");
        }
