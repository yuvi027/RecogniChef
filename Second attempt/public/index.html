<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Parser MVP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b, #ffa726);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .input-section {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .url-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .url-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .parse-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .parse-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .parse-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .recipes-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .recipe-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
        }

        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .recipe-header {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            padding: 20px;
            position: relative;
        }

        .recipe-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .recipe-source {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .recipe-body {
            padding: 25px;
        }

        .recipe-section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 5px;
        }

        .ingredient-list, .instruction-list {
            list-style: none;
            padding: 0;
        }

        .ingredient-list li, .instruction-list li {
            padding: 5px 0;
            border-bottom: 1px solid #f5f5f5;
        }

        .ingredient-list li:before {
            content: "🥄";
            margin-right: 8px;
        }

        .instruction-list li {
            padding: 10px 0;
            position: relative;
            padding-left: 30px;
        }

        .instruction-list li:before {
            content: counter(step-counter);
            counter-increment: step-counter;
            position: absolute;
            left: 0;
            top: 10px;
            background: #667eea;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .instruction-list {
            counter-reset: step-counter;
        }

        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 107, 107, 0.9);
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: #ff4757;
            transform: scale(1.1);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #333;
        }

        .recipe-count {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 600;
        }

        .error-message {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🍳 Recipe Parser MVP</h1>
        <p>Parse and save recipes locally in your browser</p>
    </div>

    <div class="main-content">
        <div class="input-section">
            <div class="input-group">
                <input type="url" class="url-input" id="urlInput"
                       placeholder="Enter recipe URL (for demo, just add a title)" />
                <button class="parse-btn" id="parseBtn" onclick="parseRecipe()">
                    Add Recipe Manually (Demo)
                </button>
            </div>
            <div class="error-message" id="errorMessage"></div>
            <div class="loading" id="loading" style="display:none;">
                <div class="spinner"></div>
                <p>Parsing recipe... This may take a moment</p>
            </div>
        </div>

        <div class="recipe-count" id="recipeCount" style="display:none;">
            📚 You have <span id="count">0</span> recipes saved
        </div>

        <div class="recipes-section" id="recipesSection">
            <div class="empty-state">
                <h3>No recipes yet</h3>
                <p>Enter a recipe URL above to get started!</p>
            </div>
        </div>
    </div>
</div>

<script>
    let recipes = [];

    // Save recipes array to localStorage
    function saveRecipes() {
        try {
            localStorage.setItem('recipes', JSON.stringify(recipes));
            console.log('[localStorage] Recipes saved:', recipes.length);
        } catch (err) {
            console.error('[localStorage] Save error:', err);
        }
    }

    // Load recipes array from localStorage
    function loadRecipes() {
        try {
            const saved = localStorage.getItem('recipes');
            if (saved) {
                recipes = JSON.parse(saved);
                console.log('[localStorage] Recipes loaded:', recipes.length);
            } else {
                recipes = [];
                console.log('[localStorage] No saved recipes found.');
            }
            displayRecipes();
        } catch (err) {
            console.error('[localStorage] Load error:', err);
            recipes = [];
            displayRecipes();
        }
    }

    // Validate URL format
    function isValidUrl(string) {
        try {
            new URL(string);
            return true;
        } catch (_) {
            return false;
        }
    }

    // Show error messages to user
    function showError(message) {
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
        setTimeout(() => errorDiv.style.display = 'none', 5000);
    }

    // Demo parseRecipe: For now, just adds a manual recipe using URL input as the title (simulate parsing)
    async function parseRecipe() {
        const urlInput = document.getElementById('urlInput');
        const url = urlInput.value.trim();
        const errorDiv = document.getElementById('errorMessage');
        const loading = document.getElementById('loading');
        const parseBtn = document.getElementById('parseBtn');

        if (!url || !isValidUrl(url)) {
            showError('Please enter a valid recipe URL.');
            return;
        }

        loading.style.display = 'block';
        parseBtn.disabled = true;
        errorDiv.style.display = 'none';

        try {
            const response = await fetch('http://localhost:3000/parse', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ url })
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || 'Something went wrong while parsing.');
            }

            const newRecipe = {
                id: Date.now(),
                title: result.title || "Untitled Recipe",
                source: result.url || url,
                url: url,
                ingredients: result.ingredients || [],
                instructions: result.instructions?.split('\n') || [],
                dateAdded: new Date().toLocaleDateString()
            };

            recipes.push(newRecipe);
            saveRecipes();
            displayRecipes();
            urlInput.value = '';

        } catch (err) {
            showError('Failed to fetch recipe: ' + err.message);
            console.error(err);
        } finally {
            loading.style.display = 'none';
            parseBtn.disabled = false;
        }
    }

    // Display all recipes in the UI
    function displayRecipes() {
        const container = document.getElementById('recipesSection');
        const countElement = document.getElementById('recipeCount');
        const countSpan = document.getElementById('count');

        if (recipes.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <h3>No recipes yet</h3>
                    <p>Enter a recipe URL above to get started!</p>
                </div>
            `;
            countElement.style.display = 'none';
            return;
        }

        countElement.style.display = 'block';
        countSpan.textContent = recipes.length;

        container.innerHTML = recipes.map(recipe => `
            <div class="recipe-card">
                <div class="recipe-header">
                    <div class="recipe-title">${recipe.title}</div>
                    <div class="recipe-source">From: ${recipe.source} • Added: ${recipe.dateAdded}</div>
                    <button class="delete-btn" onclick="deleteRecipe(${recipe.id})" title="Delete recipe">×</button>
                </div>
                <div class="recipe-body">
                    <div class="recipe-section">
                        <div class="section-title">Ingredients</div>
                        <ul class="ingredient-list">
                            ${recipe.ingredients.map(i => `<li>${i}</li>`).join('')}
                        </ul>
                    </div>
                    <div class="recipe-section">
                        <div class="section-title">Instructions</div>
                        <ol class="instruction-list">
                            ${recipe.instructions.map(i => `<li>${i}</li>`).join('')}
                        </ol>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // Delete a recipe by id and update storage/UI
    function deleteRecipe(id) {
        if (confirm('Are you sure you want to delete this recipe?')) {
            recipes = recipes.filter(r => r.id !== id);
            saveRecipes();
            displayRecipes();
        }
    }

    // Load recipes from localStorage when page loads
    window.addEventListener('DOMContentLoaded', loadRecipes);

    // Allow Enter key to trigger adding recipe
    document.getElementById('urlInput').addEventListener('keypress', e => {
        if (e.key === 'Enter') parseRecipe();
    });
</script>
</body>
</html>
